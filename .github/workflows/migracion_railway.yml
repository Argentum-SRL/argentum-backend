name: Mudanza de base a Railway

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribí MIGRAR para confirmar el ensayo'
        required: true
        default: ''

jobs:
  migracion:
    if: ${{ github.event.inputs.confirmacion == 'MIGRAR' }}
    runs-on: ubuntu-latest

    steps:
      - name: Instalar postgresql-client 17
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: Preparar base nueva
        env:
          NEW_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_URL" -c 'create extension if not exists "uuid-ossp";'
          psql "$NEW_URL" -c 'create extension if not exists pgcrypto;'

      - name: Dump desde Supabase y Restore en Railway
        env:
          OLD_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          NEW_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          pg_dump --format=custom --no-owner --no-privileges --no-comments \
            --schema=public "$OLD_URL" > ensayo.dump

          pg_restore --dbname="$NEW_URL" --no-owner --no-privileges --no-comments \
            --single-transaction --exit-on-error --verbose ensayo.dump

      - name: RESUMEN DE LA MUDANZA
        env:
          OLD_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          NEW_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          echo "=== CONTEOS EN SUPABASE (ORIGEN) ==="
          psql "$OLD_URL" -At -F' | ' -c "
          select table_name,
           (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text::bigint
          from information_schema.tables
          where table_schema='public' and table_type='BASE TABLE'
          order by 1;" > viejos.txt
          cat viejos.txt

          echo "=== CONTEOS EN RAILWAY (DESTINO) ==="
          psql "$NEW_URL" -At -F' | ' -c "
          select table_name,
           (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text::bigint
          from information_schema.tables
          where table_schema='public' and table_type='BASE TABLE'
          order by 1;" > nuevos.txt
          cat nuevos.txt

          echo "=== COMPARACIÓN DE TABLAS ==="
          diff viejos.txt nuevos.txt || true
