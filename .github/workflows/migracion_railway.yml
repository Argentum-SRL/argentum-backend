name: Mudanza de base a Railway

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribí MIGRAR para confirmar el ensayo'
        required: true
        default: ''

jobs:
  migracion:
    if: ${{ github.event.inputs.confirmacion == 'MIGRAR' }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Instalar herramientas oficiales de PostgreSQL 17
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> $GITHUB_PATH

      - name: 2. Preparar base nueva en Railway (Esquemas y Extensiones)
        env:
          NEW_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          psql "$NEW_URL" -c '
            -- Crear esquema aislado de extensiones
            CREATE SCHEMA IF NOT EXISTS extensions;
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA extensions;
            CREATE EXTENSION IF NOT EXISTS pgcrypto SCHEMA extensions;
            
            -- Configurar base de datos para reconocer public y extensions
            DO $$ 
            BEGIN 
              EXECUTE '\''ALTER DATABASE '\'' || current_database() || '\'' SET search_path TO public, extensions, pg_catalog;'\''; 
            END $$;

            -- Limpiar public para que el restore no choque
            DROP SCHEMA IF EXISTS public CASCADE;
          '

      - name: 3. Migrar datos (Dump Supabase -> Restore Railway)
        env:
          OLD_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          NEW_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          pg_dump --format=custom --no-owner --no-privileges --no-comments \
            --schema=public "$OLD_URL" > migracion.dump

          pg_restore --dbname="$NEW_URL" --no-owner --no-privileges --no-comments \
            --single-transaction --exit-on-error --verbose migracion.dump

      - name: 4. RESUMEN DE LA MUDANZA (Comparación)
        env:
          OLD_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          NEW_URL: ${{ secrets.NEW_DATABASE_URL }}
        run: |
          echo "=== TABLAS Y FILAS EN SUPABASE (ORIGEN) ==="
          psql "$OLD_URL" -At -F' | ' -c "
          select table_name,
           (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text::bigint
          from information_schema.tables
          where table_schema='public' and table_type='BASE TABLE'
          order by 1;" > viejos.txt
          cat viejos.txt

          echo "=== TABLAS Y FILAS EN RAILWAY (DESTINO) ==="
          psql "$NEW_URL" -At -F' | ' -c "
          select table_name,
           (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text::bigint
          from information_schema.tables
          where table_schema='public' and table_type='BASE TABLE'
          order by 1;" > nuevos.txt
          cat nuevos.txt

          echo "=== DIFERENCIAS ENTRE BASES ==="
          diff viejos.txt nuevos.txt || true
